{% extends 'base.html' %}

{% block title %}Generación de rutas{% endblock %}

{% block content %}
<div class="container my-5">
    <h1 class="text-center mb-5">Tallas por distribuir</h1>
    <select class="form-select form-select-lg" id="estado_visible">
        <option value="AGUASCALIENTES">AGUASCALIENTES</option>
        <option value="BAJA CALIFORNIA">BAJA CALIFORNIA</option>
        <option value="BAJA CALIFORNIA SUR">BAJA CALIFORNIA SUR</option>
        <option value="CAMPECHE">CAMPECHE</option>
        <option value="COAHUILA">COAHUILA</option>
        <option value="COLIMA">COLIMA</option>
        <option value="CHIAPAS">CHIAPAS</option>
        <option value="CHIHUAHUA">CHIHUAHUA</option>
        <option value="DURANGO">DURANGO</option>
        <option value="GUANAJUATO">GUANAJUATO</option>
        <option value="GUERRERO">GUERRERO</option>
        <option value="HIDALGO">HIDALGO</option>
        <option value="JALISCO">JALISCO</option>
        <option value="ESTADO DE MEXICO">ESTADO DE MEXICO</option>
        <option value="MICHOACAN">MICHOACAN</option>
        <option value="MORELOS">MORELOS</option>
        <option value="NAYARIT">NAYARIT</option>
        <option value="NUEVO LEON">NUEVO LEON</option>
        <option value="OAXACA">OAXACA</option>
        <option value="PUEBLA">PUEBLA</option>
        <option value="QUERETARO">QUERETARO</option>
        <option value="QUINTANA ROO">QUINTANA ROO</option>
        <option value="SAN LUIS POTOSI">SAN LUIS POTOSI</option>
        <option value="SINALOA">SINALOA</option>
        <option value="SONORA">SONORA</option>
        <option value="TABASCO">TABASCO</option>
        <option value="TAMAULIPAS">TAMAULIPAS</option>
        <option value="TLAXCALA">TLAXCALA</option>
        <option value="VERACRUZ">VERACRUZ</option>
        <option value="YUCATAN">YUCATAN</option>
        <option value="ZACATECAS">ZACATECAS</option>
    </select>
    <br>
    <div id="cargar_general" class="loading-spinner" style="display: flex;">
        <div class="spinner"></div>
    </div>
    <br>
    <h1><span class="badge bg-warning text-black" id="alerta_existencia">No hay que entregar algo en ESTADO</span></h1>
    <br>
    <form class="w-100" id="formulario_inventario">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-primary text-white">
                        <h2 class="card-title h5 mb-0">Playeras</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group row" id="campos_playera">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-success text-white">
                        <h2 class="card-title h5 mb-0">Pantalones</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group row" id="campos_pantalon">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4 mb-4">
                <div class="card">
                    <div class="card-header bg-info text-white">
                        <h2 class="card-title h5 mb-0">Calzado</h2>
                    </div>
                    <div class="card-body">
                        <div class="form-group row" id="campos_calzado">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
<main class="hero my-5">
    <div class="container" id="visibiilidad_rutas">
        <div class="row align-items-center">
            <h1 class="text-center mb-5">Mapa de rutas</h1>
            <div class="text-center">
                <button onclick="procesar_mapa()" class="btn btn-primary col-2" id="boton_generador">Generar rutas</button>
            </div>
            <div class="col-md-12" id="mapa">
                <div id="loader" class="loading-spinner">
                    <div class="spinner"></div>
                </div>
                <div class="ratio ratio-16x9" id="map-container" style="display: block;">
                    <iframe id="map-frame" title="Mapa de rutas" allowfullscreen></iframe>
                </div>
            </div>
        </div>
    </div>
</main>
{% endblock %}

{% block scripts %}
	{{ super() }}
	<script type='text/javascript'>
        let urlUser = "{{url_for("mapa_ruta")}}"
        let urlUser_form = "{{url_for("actualizar_formulario")}}"
	</script>
{% endblock %}
