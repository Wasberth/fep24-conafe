{% extends 'form.html' %}
{% block formtitle %} Reinscribir alumno {% endblock %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-body text-center">
                    <h1 class="card-title mb-4">Ingresa el CURP del alumno a reinscribir:</h1>
                    <form class="d-flex" role="search" action="/alumno/reinscripcion" method="post">
                        <input class="form-control me-2" type="search" placeholder="CURP" aria-label="Search" name="curp" id="curp">
                        <button class="btn btn-outline-success" type="submit">Buscar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
