{% extends 'base.html' %}

{% block title %}Carga de Archivo{% endblock %}

{% block content %}
<div class="container mt-5">
    <h1 class="mb-4">Subir archivo JSON</h1>
    <div id="drop-zone" class="mb-3">
        <p>Arrastra y suelta tu archivo JSON aquí o haz clic para seleccionar</p>
        <input type="file" id="fileInput" accept=".json" class="d-none">
    </div>
    <div id="file-info" class="mt-3"></div>
</div>
{% endblock %}
